name: audio
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Data + numerics (used everywhere)
  - pandas
  - numpy
  - tqdm
  - h5py
  # C++ Standard library for SciPy wheels on older Linux clusters
  - libstdcxx-ng
  # Audio loading / resampling (audio_preprocess.py, precompute_audio_embeddings.py)
  - librosa
  # EDA notebooks (optional — drop if you don't run audio_analysis.ipynb)
  - matplotlib
  - seaborn
  - jupyter
  - ipykernel
  # Pinned via pip because: (a) torch wheel selection depends on CUDA/MPS,
  # (b) pycocoevalcap is not on conda-forge.
  # transformers<4.46: 4.46 refactored GPT2Attention and removed internal
  # helpers (_split_heads/_merge_heads/_attn) that model/cross_attention.py
  # depends on. Lift this cap by porting cross_attention.py to stable APIs.
  - pip:
      - torch>=2.1
      - transformers>=4.30,<4.46
      - accelerate>=0.20
      - pycocoevalcap
