name: audio
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Data + numerics (used everywhere)
  - pandas
  - numpy
  - tqdm
  - h5py
  # Audio loading / resampling (audio_preprocess.py, precompute_audio_embeddings.py)
  - librosa
  # EDA notebooks (optional — drop if you don't run audio_analysis.ipynb)
  - matplotlib
  - seaborn
  - jupyter
  - ipykernel
  # Pinned via pip because: (a) torch wheel selection depends on CUDA/MPS,
  # (b) pycocoevalcap is not on conda-forge.
  - pip:
      - torch>=2.1
      - transformers>=4.30,<5.0
      - accelerate>=0.20
      - pycocoevalcap
