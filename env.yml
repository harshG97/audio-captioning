name: audio
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # Data + numerics (used everywhere)
  - pandas
  - numpy
  - tqdm
  - h5py
  # Install scipy via conda so it links to conda's libstdc++ automatically
  - scipy
  # Audio loading / resampling (audio_preprocess.py, precompute_audio_embeddings.py)
  - librosa
  # EDA notebooks (optional — drop if you don't run audio_analysis.ipynb)
  - matplotlib
  - seaborn
  - jupyter
  - ipykernel
  # Pinned via pip because: (a) torch wheel selection depends on CUDA/MPS,
  # (b) pycocoevalcap is not on conda-forge.
  # transformers==4.45.2: 4.46 refactored GPT2Attention and removed internal
  # helpers (_split_heads/_merge_heads/_attn) that model/cross_attention.py
  # depends on. Pinned exactly (not a range) because attention behaviour
  # changed inside the 4.4x series (GPT-2 defaults to SDPA from 4.42), so
  # results are only comparable on the same version.
  # tests/test_decoder_causality.py checks the decoder masking on whatever
  # version is installed.
  - pip:
      - torch>=2.1
      - transformers==4.45.2
      - accelerate>=0.20
      - pycocoevalcap
      - pytest
